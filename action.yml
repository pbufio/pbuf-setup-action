name: 'pbuf-setup'
description: 'Install pbuf-cli and optionally run schema drift checks with sticky PR comments'
author: 'pbuf.io'

branding:
  color: purple
  icon: power

inputs:
  version:
    description: The version of the CLI to install (e.g., v0.16.0 or latest)
    required: false
    default: 'v0.16.0'
  pbuf_token:
    description: The API token to use with PBUF registry.
    required: false
  drift_diff:
    description: Run pbuf drift diff against the registry baseline.
    required: false
    default: 'false'
  fail_on:
    description: Severity threshold to fail drift diff check (critical, warning, info, or none).
    required: false
    default: 'critical'
  against:
    description: Baseline registry tag to compare against (defaults to latest published tag).
    required: false
    default: ''
  working_directory:
    description: Working directory containing pbuf.yaml for drift diff checks.
    required: false
    default: ''
  comment_on_pr:
    description: Post or update a sticky pull request comment with the drift diff report.
    required: false
    default: 'false'
  github_token:
    description: GitHub token used to post or update sticky pull request comments.
    required: false
    default: ${{ github.token }}

outputs:
  drift_markdown:
    description: Markdown report generated by pbuf drift diff.
  drift_exit_code:
    description: Exit code returned by pbuf drift diff.

runs:
  using: node24
  main: dist/index.js
