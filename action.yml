name: 'pbuf-setup'
description: 'Install pbuf-cli and optionally run offline proto lint and schema drift checks'
author: 'pbuf.io'

branding:
  color: purple
  icon: power

inputs:
  version:
    description: The version of the CLI to install (e.g., v0.19.0 or latest)
    required: false
    default: 'v0.19.0'
  pbuf_token:
    description: The API token to use with PBUF registry.
    required: false
  registry_url:
    description: Registry address (host[:port] or URL) exported as PBUF_REGISTRY_ADDR for self-hosted registries.
    required: false
    default: ''
  registry_insecure:
    description: Connect to the registry over plaintext gRPC without TLS when registry_url (or PBUF_REGISTRY_ADDR) is set.
    required: false
    default: 'false'
  lint:
    description: Run offline pbuf lint and emit GitHub Actions file annotations on violations.
    required: false
    default: 'false'
  lint_paths:
    description: Optional newline- or whitespace-separated paths to pass to pbuf lint (quote paths containing spaces; defaults to export.paths in pbuf.yaml, or api / proto; set lint_paths to . to scan the whole directory).
    required: false
    default: ''
  drift_diff:
    description: Run pbuf drift diff against the registry baseline.
    required: false
    default: 'false'
  fail_on:
    description: Severity threshold to fail drift diff check (critical, warning, info, or none).
    required: false
    default: 'critical'
  against:
    description: Baseline registry tag to compare against (defaults to latest published tag).
    required: false
    default: ''
  working_directory:
    description: Working directory containing pbuf.yaml for pbuf auth, pbuf lint, and pbuf drift diff.
    required: false
    default: ''
  comment_on_pr:
    description: Post or update a sticky pull request comment with the drift diff report.
    required: false
    default: 'false'
  github_token:
    description: GitHub token used for authenticated latest CLI release lookup and sticky pull request comments.
    required: false
    default: ${{ github.token }}

outputs:
  lint_exit_code:
    description: Exit code returned by pbuf lint.
  drift_markdown:
    description: Markdown report generated by pbuf drift diff.
  drift_exit_code:
    description: Exit code returned by pbuf drift diff.

runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
