env:
  commonjs: true
  es6: true
  jest: true
  node: true

globals:
  AbortSignal: readonly
  Atomics: readonly
  SharedArrayBuffer: readonly
  fetch: readonly

ignorePatterns:
  - '!.*'
  - '**/node_modules/.*'
  - '**/dist/.*'
  - '**/coverage/.*'
  - '*.json'

parserOptions:
  ecmaVersion: 2023
  sourceType: script

plugins:
  - jest

extends:
  - eslint:recommended
  - plugin:github/recommended
  - plugin:jest/recommended

rules:
  {
    'camelcase': 'off',
    'eslint-comments/no-use': 'off',
    'eslint-comments/no-unused-disable': 'off',
    'i18n-text/no-en': 'off',
    'import/no-commonjs': 'off',
    'import/no-namespace': 'off',
    'no-console': 'off',
    'no-unused-vars': 'off',
    'prettier/prettier': 'error',
    'semi': 'off'
  }
