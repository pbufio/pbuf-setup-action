env:
  commonjs: true
  es6: true
  jest: true
  node: true

globals:
  AbortSignal: readonly
  Atomics: readonly
  SharedArrayBuffer: readonly
  fetch: readonly

ignorePatterns:
  - '!.*'
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/coverage/**'
  - '*.json'

parserOptions:
  ecmaVersion: 2023
  sourceType: script

plugins:
  - jest

extends:
  - eslint:recommended
  - plugin:jest/recommended

rules:
  {
    'no-console': 'off',
    'no-unused-vars': ['error', { 'argsIgnorePattern': '^_' }]
  }
