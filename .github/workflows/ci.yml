name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

      - name: Verify dist/ Bundle
        id: verify-dist
        run: |
          npm run package
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "Detected uncommitted or untracked changes in dist/:"
            git status --short dist/
            git diff --ignore-space-at-eol --text dist/
            exit 1
          fi

  test-action:
    name: GitHub Actions Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action (Default Version)
        id: test-action
        uses: ./

      - name: Check pbuf CLI
        id: check-pbuf-cli
        run: |
          pbuf --version | grep "v0.21.0"
          SMOKE_DIR="${RUNNER_TEMP}/pbuf-smoke"
          mkdir -p "${SMOKE_DIR}/api" && cd "${SMOKE_DIR}"
          pbuf init pbufio/pbuf-setup-action
          test -f pbuf.yaml
          cat <<'EOF' > "${SMOKE_DIR}/api/HelloService.proto"
          syntax = "proto3";
          package smoke.v1;
          message HelloRequest {
            string user_id = 1;
          }
          EOF

      - name: Test Local Action With Auth Token (Latest)
        id: test-action-with-config
        uses: ./
        with:
          version: latest
          pbuf_token: "hello_token"
          registry_url: "registry.internal:6777"

      - name: Check .netrc
        id: check-netrc
        run: grep -q "machine registry.internal" ~/.netrc

      - name: Test Local Action Offline Lint
        id: test-lint
        uses: ./
        with:
          lint: true
          lint_ignore_rules: FILE_NAME
          working_directory: ${{ runner.temp }}/pbuf-smoke

      - name: Verify Lint Output
        run: test "${{ steps.test-lint.outputs.lint_exit_code }}" = "0"
