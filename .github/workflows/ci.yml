name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action (Default Version)
        id: test-action
        uses: ./

      - name: Check pbuf CLI
        id: check-pbuf-cli
        run: |
          pbuf --version | grep "v0.19.0"
          mkdir -p /tmp/pbuf-smoke/api && cd /tmp/pbuf-smoke
          pbuf init pbufio/pbuf-setup-action
          test -f pbuf.yaml
          cat <<'EOF' > /tmp/pbuf-smoke/api/hello.proto
          syntax = "proto3";
          package smoke.v1;
          message HelloRequest {
            string user_id = 1;
          }
          EOF

      - name: Test Local Action With Auth Token (Latest)
        id: test-action-with-config
        uses: ./
        with:
          version: latest
          pbuf_token: "hello_token"
          registry_url: "registry.internal:6777"

      - name: Check .netrc
        id: check-netrc
        run: grep -q "machine registry.internal" ~/.netrc

      - name: Test Local Action Offline Lint
        id: test-lint
        uses: ./
        with:
          lint: true
          working_directory: /tmp/pbuf-smoke

      - name: Verify Lint Output
        run: test "${{ steps.test-lint.outputs.lint_exit_code }}" = "0"
