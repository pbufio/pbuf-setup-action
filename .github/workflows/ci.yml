name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action (Pinned Version)
        id: test-action
        uses: ./
        with:
          version: v0.17.0

      - name: Check pbuf CLI
        id: check-pbuf-cli
        run: |
          pbuf --version | grep "v0.17.0"
          mkdir -p /tmp/pbuf-smoke && cd /tmp/pbuf-smoke
          pbuf init pbufio/pbuf-setup-action
          test -f pbuf.yaml

      - name: Test Local Action With Auth Token (Latest)
        id: test-action-with-config
        uses: ./
        with:
          version: latest
          pbuf_token: "hello_token"

      - name: Check .netrc
        id: check-netrc
        run: test -s ~/.netrc
